[workspace]
resolver = "2"
members = [
    "crates/context-types",
    "crates/context-core",
    "crates/context-store",
    "crates/context-cli",
    "crates/context-runtime",
    "crates/context-parsers",
    "crates/context-model",
    "crates/context-ffi"
, "crates/context-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/Souls-in-Development/creature-context-windows"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.9"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v7"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = { version = "3.5", features = ["termination"] }

[profile.release]
lto = "thin"
strip = true
